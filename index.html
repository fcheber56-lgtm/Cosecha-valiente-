  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(25,f+slide),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||.05,t+Math.min(.012,d*.3));g.gain.exponentialRampToValueAtTime(.0001,t+d);
  let n=o;if(filt){const bq=AC.createBiquadFilter();bq.type=filt[0];bq.frequency.value=filt[1];o.connect(bq);n=bq;}
  n.connect(g);g.connect(dest||sfxG);o.onended=()=>{busy--;};o.start(t);o.stop(t+d+.02);}catch(e){busy=Math.max(0,busy-1);}
}
function noise(d,v,f0,f1,type,q,delay,dest){
 if(!AC||muted||busy>=MAXV)return;try{busy++;const t=AC.currentTime+(delay||0),s=AC.createBufferSource();s.buffer=noiseBuf;s.loop=true;
  const f=AC.createBiquadFilter();f.type=type||'lowpass';f.Q.value=q||1;f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(Math.max(30,f1),t+d);
  const g=AC.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+Math.min(.01,d*.3));g.gain.exponentialRampToValueAtTime(.0001,t+d);
  s.connect(f);f.connect(g);g.connect(dest||sfxG);s.onended=()=>{busy--;};s.start(t,Math.random());s.stop(t+d+.02);}catch(e){busy=Math.max(0,busy-1);}
}

/* ---- música: drone grave + caja de música desafinada + latido + gemidos lejanos ---- */
const SCALE=[164.81,174.61,196,220,246.94,261.63,293.66,329.63,349.23,392,440,466.16,493.88,523.25,587.33];
function bell(f,when,v){
 if(!AC)return;[[1,1],[2.76,.3]].forEach(p=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';
  o.frequency.value=f*p[0]*(1+(Math.random()-.5)*.006);g.gain.setValueAtTime(.0001,when);g.gain.exponentialRampToValueAtTime(v*p[1],when+.006);g.gain.exponentialRampToValueAtTime(.0001,when+1.9/p[0]**.6);
  o.connect(g);g.connect(musG);g.connect(echoIn);o.start(when);o.stop(when+2.1);});
}
function thump(when,v){
 const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.setValueAtTime(78,when);o.frequency.exponentialRampToValueAtTime(34,when+.2);
 g.gain.setValueAtTime(.0001,when);g.gain.exponentialRampToValueAtTime(v,when+.01);g.gain.exponentialRampToValueAtTime(.0001,when+.26);o.connect(g);g.connect(musG);o.start(when);o.stop(when+.3);
}
function startMusic(){
 if(mus.on||!AC)return;mus.on=true;
 // drone
 const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=260;lp.Q.value=4;
 const dg=AC.createGain();dg.gain.value=.07;
 const o1=AC.createOscillator(),o2=AC.createOscillator(),o3=AC.createOscillator();
 o1.type='sawtooth';o1.frequency.value=55;o2.type='sawtooth';o2.frequency.value=55.45;o3.type='sine';o3.frequency.value=82.4;
 const lfo=AC.createOscillator(),lg=AC.createGain();lfo.frequency.value=.07;lg.gain.value=130;lfo.connect(lg);lg.connect(lp.frequency);
 [o1,o2,o3].forEach(o=>{o.connect(lp);o.start();});lfo.start();lp.connect(dg);dg.connect(musG);
 drone={lp,dg,o3};
 mus.next=AC.currentTime+.3;
 mus.timer=setInterval(musicTick,120);
}
function musicTick(){
 if(!AC||AC.state!=='running')return;
 mus.inten+=(mus.tgt-mus.inten)*.04;
 const beat=.66-mus.inten*.2,t=AC.currentTime;
 try{drone.dg.gain.setTargetAtTime(.05+mus.inten*.06,t,.5);drone.lp.frequency.setTargetAtTime(220+mus.inten*260,t,.8);
  drone.o3.frequency.setTargetAtTime(mus.inten>.85?77.8:82.4,t,2);}catch(e){}
 while(mus.next<t+.35){
  const w=mus.next,s=mus.step;
  // caja de música: paseo aleatorio por una escala oscura
  const dens=.35+mus.inten*.35;
  if(Math.random()<dens){mus.idx=Math.max(0,Math.min(SCALE.length-1,mus.idx+Math.floor(Math.random()*5)-2));
   let f=SCALE[mus.idx];if(Math.random()<.12)f*=1.0595; // nota desafinada
   bell(f,w,.045);if(Math.random()<.18)bell(SCALE[Math.max(0,mus.idx-2)],w+beat*.5,.03);}
  // latido
  if(s%4===0&&mus.inten>.25){thump(w,.16+mus.inten*.12);thump(w+.2,.1+mus.inten*.1);}
  if(mus.inten>.7&&s%2===0)thump(w,.1);
  // glissando fantasmal ocasional
  if(s%48===24&&Math.random()<.8){const o=AC.createOscillator(),g=AC.createGain(),v=AC.createOscillator(),vg=AC.createGain();
   o.type='sine';o.frequency.setValueAtTime(520,w);o.frequency.exponentialRampToValueAtTime(380,w+4);v.frequency.value=5.5;vg.gain.value=9;v.connect(vg);vg.connect(o.frequency);
   g.gain.setValueAtTime(.0001,w);g.gain.exponentialRampToValueAtTime(.022,w+1.5);g.gain.exponentialRampToValueAtTime(.0001,w+4);o.connect(g);g.connect(musG);g.connect(echoIn);o.start(w);v.start(w);o.stop(w+4.2);v.stop(w+4.2);}
  mus.step++;mus.next+=beat;
 }
}

 fpsAvg=fpsAvg*.96+dt*.04;lowFx=fpsAvg>.027;
 ambient(dt);

 if(phase==='wave'||phase==='ready'){if(!paused)update(dt*speed);}
 else if(phase==='won'||phase==='lost')mus.tgt=phase==='lost'?.05:.3;
 else mus.tgt=.15;

  ctx.save();if(shake>0)ctx.translate(R(-shake,shake)*.5,R(-shake,shake)*.5);drawScene();ctx.restore();
  drawHUD();
  if(phase==='ready'&&hint&&G.next<12){txt('Toca una carta y luego una casilla',W/2+30,RY+RH*3,19,'#fff');txt('Toca las gotas de néctar para recogerlas',W/2+30,RY+RH*3+28,15,'#ffe9a0');}

function act(id){
 if(id==='play'){phase='levels';snd('click');}
 else if(id==='back'){phase='menu';snd('click');}
 else if(id&&id.startsWith('lvl:')){const L=+id.slice(4);if(L<=SAVE.unlocked)openLevel(L);}
 else if(id&&id.startsWith('pk:')){const k=id.slice(3),i=PICK.sel.indexOf(k);if(i>=0){PICK.sel.splice(i,1);snd('click');}else if(PICK.sel.length<PICK.slots){PICK.sel.push(k);snd('click');}else snd('deny');}
 else if(id==='pkback'){phase='levels';snd('click');}
 else if(id==='pkgo'){if(PICK.sel.length){SAVE.pick=PICK.sel.slice();saveGame();startLevel(PICK.level,PICK.sel.slice());}else snd('deny');}
 else if(id==='again'){startLevel(G.level,G.mode==='bug'?null:G.baseCards);}
 else if(id==='next'){openLevel(Math.min(MAXL,G.level+1));}
 else if(id==='levels'){phase='levels';paused=false;snd('click');}
 else if(id==='resume')paused=false;
 else if(id==='pause')paused=!paused;
 else if(id==='speed')speed=speed===1?2:1;
 else if(id==='mute')setMuted(!muted);
 else if(id==='skip'){G.next=Math.min(G.next,.2);}
 else if(id&&id.startsWith('card:')){const k=id.slice(5);if(G.sel===k)G.sel=null;else{G.sel=k;snd('click');}}
}

 if(id){act(id);return;}
